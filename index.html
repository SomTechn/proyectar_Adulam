<style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;background:#020617}
*{box-sizing:border-box}
/* ===== Escenario de proyección (sin Tailwind para funcionar sin internet) ===== */
.stg{position:absolute;inset:0;overflow:hidden;background:#000;color:#fff}
.stg-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.stg-dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .3s}
.stg-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .35s ease}
.stg-box{display:flex;flex-direction:column;align-items:center;gap:.4em}
.stg-t{white-space:pre-line;line-height:1.18;overflow-wrap:normal;word-break:normal}
.stg-ref{opacity:.85;font-weight:600;letter-spacing:.02em}
.stg-cuenta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .35s;font-variant-numeric:tabular-nums}
.stg-logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;pointer-events:none}
.stg-logo img{max-width:60%;max-height:60%;object-fit:contain}
.stg-msg{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(100%)}
.stg-msg div{background:rgba(220,38,38,.92);color:#fff;font-weight:700;text-align:center;width:100%}
.stg-msg.on{opacity:1;transform:none}
.stg-negro{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .35s;pointer-events:none}
/* ===== Pantalla completa ===== */
#scr{position:fixed;inset:0;cursor:none;background:#000}
.hint{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:rgba(15,23,42,.85);color:#e2e8f0;padding:10px 16px;border-radius:12px;font-size:14px;transition:opacity .6s;z-index:5;cursor:default}
.dot{position:fixed;top:10px;right:10px;width:10px;height:10px;border-radius:50%;z-index:6;transition:opacity .8s}
.setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617;z-index:9;cursor:default}
.setup .card{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:24px;width:min(92vw,380px);color:#e2e8f0}
.setup input{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-size:20px;letter-spacing:.15em;text-align:center;margin:12px 0}
.setup button{width:100%;padding:12px;border:0;border-radius:10px;background:#4f46e5;color:#fff;font-weight:700;font-size:16px}
/* ===== Escenario (músicos / púlpito) ===== */
#esc{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;padding:2vh 3vw;gap:2vh;cursor:none}
#esc .bar{display:flex;justify-content:space-between;align-items:center;font-variant-numeric:tabular-nums}
#esc .reloj{font-size:7vh;font-weight:700}
#esc .timer{font-size:7vh;font-weight:700;color:#fbbf24}
#esc .badges span{display:inline-block;margin-right:1vw;padding:.4vh 1vw;border-radius:8px;font-size:2.4vh;font-weight:700}
#esc .act{flex:1;min-height:0;position:relative;border:2px solid #16a34a;border-radius:14px}
#esc .act .lab,#esc .sig .lab{position:absolute;top:1vh;left:1.2vw;font-size:2.2vh;color:#86efac;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
#esc .act .tx{position:absolute;inset:5vh 2vw 2vh;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;line-height:1.15;font-weight:700}
#esc .sig{height:24vh;position:relative;border:2px solid #334155;border-radius:14px;color:#94a3b8}
#esc .sig .lab{color:#94a3b8}
#esc .sig .tx{position:absolute;inset:5vh 2vw 1.5vh;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;line-height:1.15;font-size:3.6vh}
#esc .msg{background:#dc2626;border-radius:10px;padding:1vh 1.5vw;font-size:3.4vh;font-weight:700;text-align:center}
/* ===== Control ===== */
.scroll-thin::-webkit-scrollbar{width:8px;height:8px}.scroll-thin::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
.ptxt{white-space:pre-line;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.prev169{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

input,select,textarea{font-size:16px}

function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function hashParams(){ var h=location.hash.replace(/^#/,''); var i=h.indexOf('?'); var v=i>=0?h.slice(0,i):h; var p={}; if(i>=0) h.slice(i+1).split('&').forEach(function(kv){ var a=kv.split('='); if(a[0]) p[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||''); }); return {vista:v||'control', p:p}; }

/* =====================================================================

var STAGES = [];
function stageEnsure(root){
  if(root._stg) return root._stg;
  root.innerHTML =
    '<div class="stg"><div class="stg-bg"></div><div class="stg-dim"></div>'+

    '<div class="stg-cuenta"><div class="cl"></div><div class="cn"></div></div>'+
    '<div class="stg-logo"></div><div class="stg-msg"><div></div></div><div class="stg-negro"></div></div>';
  var el=root.firstChild;
  var g = { root:root, el:el, bg:el.children[0], dim:el.children[1], layers:[el.children[2],el.children[3]], act:0,
            cuenta:el.children[4], logo:el.children[5], msg:el.children[6], negro:el.children[7], key:null, est:{}, tema:temaFull() };
  root._stg=g; STAGES.push(g);
  return g;
}
function fitLayer(layer, txt, ref, t, W, H){
  var box=layer.firstChild, tx=box.children[0], rf=box.children[1];
  var maxW=W*0.9, maxH=H*(ref?0.76:0.86);
  tx.textContent=txt; rf.textContent=ref||''; rf.style.display=ref?'block':'none';
  tx.style.fontFamily=FUENTES[t.fuente]||FUENTES.sans;
  tx.style.color=t.color; rf.style.color=t.color;
  tx.style.textTransform=t.mayus?'uppercase':'none';
  tx.style.textAlign=t.alinear; box.style.alignItems=t.alinear==='left'?'flex-start':'center';
  tx.style.fontWeight='700';
  tx.style.width=maxW+'px';
  var sh=Math.max(1,H*0.004);
  tx.style.textShadow=t.sombra?('0 '+sh+'px '+(sh*3)+'px rgba(0,0,0,.85)'):'none';
  rf.style.textShadow=tx.style.textShadow;
  rf.style.fontSize=Math.max(8,H*0.04)+'px';
  rf.style.fontFamily=tx.style.fontFamily;
  var lo=4, hi=Math.max(8,H*(t.tam||8)/100);
  tx.style.fontSize=hi+'px';
  if(tx.scrollWidth>maxW+1 || tx.scrollHeight>maxH+1){
    for(var i=0;i<14;i++){
      var mid=(lo+hi)/2; tx.style.fontSize=mid+'px';
      if(tx.scrollWidth>maxW+1 || tx.scrollHeight>maxH+1) hi=mid; else lo=mid;
    }
    tx.style.fontSize=lo+'px';
  }
}
function renderStage(root, est, tema){
  var g=stageEnsure(root); est=est||{}; var t=temaFull(tema);
  g.est=est; g.tema=t;
  var W=root.clientWidth||1, H=root.clientHeight||1;
  g.el.style.background=fondoCss(t);
  g.bg.style.backgroundImage=t.fondoImg?'url("'+t.fondoImg.replace(/"/g,'')+'")':'none';
  g.dim.style.opacity=t.fondoImg?(t.oscurecer/100):0;
  var cuenta=!!(est.cuenta&&est.cuenta.fin);
  var vis=!cuenta && est.slide && !est.oculto;
  var txt=vis?(est.slide.texto||''):'', ref=vis?(est.slide.ref||''):'';
  var k=txt+'\u0001'+ref, sk=JSON.stringify(t)+W+'x'+H;
  if(k!==g.key){
    var nx=g.layers[1-g.act], cu=g.layers[g.act];
    if(txt){ fitLayer(nx,txt,ref,t,W,H); nx.style.opacity=1; } else nx.style.opacity=0;
    cu.style.opacity=0; g.act=1-g.act; g.key=k; g.sk=sk;
  } else if(sk!==g.sk && txt){
    fitLayer(g.layers[g.act],txt,ref,t,W,H); g.sk=sk;
  }
  // cuenta regresiva
  g.cuenta.style.opacity=cuenta?1:0;

    }

  var md=g.msg.firstChild;

/* =====================================================================
   TIEMPO REAL · Supabase Realtime por WebSocket (sin supabase-js)
   ===================================================================== */
function RT(sala, meta){
  this.topic='realtime:proy-'+sala; this.meta=meta||{}; this.ref=0; this.h={};
  this.joined=false; this.presence={}; this.retry=0; this.cerrado=false;
  this.connect();
  var me=this;
  this.hb=setInterval(function(){ me.raw({topic:'phoenix',event:'heartbeat',payload:{}}); },25000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && (!me.ws||me.ws.readyState>1)) me.connect(); });
  window.addEventListener('online',function(){ if(!me.ws||me.ws.readyState>1) me.connect(); });
}
RT.prototype.on=function(ev,cb){ (this.h[ev]=this.h[ev]||[]).push(cb); return this; };
RT.prototype.emit=function(ev,d){ (this.h[ev]||[]).forEach(function(cb){ try{ cb(d); }catch(e){ console.error(e); } }); };
RT.prototype.raw=function(m){ if(this.ws&&this.ws.readyState===1){ m.ref=String(++this.ref); this.ws.send(JSON.stringify(m)); return m.ref; } return null; };
RT.prototype.connect=function(){
  var me=this; if(me.cerrado) return;
  try{ if(me.ws) me.ws.close(); }catch(e){}
  var ws=new WebSocket(URL_BASE.replace('https','wss')+'/realtime/v1/websocket?apikey='+ANON+'&vsn=1.0.0');
  me.ws=ws; me.joined=false; me.emit('estado_conexion');
  ws.onopen=function(){
    me.retry=0;
    var r=String(++me.ref); me.joinRef=r;
    ws.send(JSON.stringify({topic:me.topic,event:'phx_join',payload:{config:{broadcast:{self:false,ack:false},presence:{key:CID},private:false}},ref:r,join_ref:r}));
  };
  ws.onmessage=function(e){
    var m; try{ m=JSON.parse(e.data); }catch(x){ return; }
    if(m.topic!==me.topic) return;
    if(m.event==='phx_reply' && m.ref===me.joinRef){
      if(m.payload&&m.payload.status==='ok'){
        me.joined=true;
        me.raw({topic:me.topic,event:'presence',payload:{type:'presence',event:'track',payload:me.meta},join_ref:me.joinRef});
        me.emit('estado_conexion'); me.emit('unido');
      } else { console.warn('join',m.payload); }
    } else if(m.event==='broadcast' && m.payload){
      me.emit('msg',{event:m.payload.event, env:m.payload.payload});
    } else if(m.event==='presence_state'){
      me.presence=m.payload||{}; me.emit('presencia');
    } else if(m.event==='presence_diff'){
      var j=(m.payload&&m.payload.joins)||{}, l=(m.payload&&m.payload.leaves)||{};
      Object.keys(l).forEach(function(k){ if(!me.presence[k]) return; var refs=(l[k].metas||[]).map(function(x){return x.phx_ref;}); me.presence[k].metas=me.presence[k].metas.filter(function(x){ return refs.indexOf(x.phx_ref)<0; }); if(!me.presence[k].metas.length) delete me.presence[k]; });
      Object.keys(j).forEach(function(k){ if(!me.presence[k]) me.presence[k]={metas:[]}; me.presence[k].metas=me.presence[k].metas.concat(j[k].metas||[]); });
      me.emit('presencia');
    } else if(m.event==='phx_error' || m.event==='phx_close'){
      try{ ws.close(); }catch(x){}
    }
  };
  ws.onclose=function(){
    if(me.ws!==ws) return;
    me.joined=false; me.emit('estado_conexion');
    var d=[1000,2000,4000,8000,15000][Math.min(me.retry++,4)];
    setTimeout(function(){ if(me.ws===ws) me.connect(); },d);
  };
};
RT.prototype.send=function(ev,env){
  if(!this.joined) return false;
  this.raw({topic:this.topic,event:'broadcast',payload:{type:'broadcast',event:ev,payload:env},join_ref:this.joinRef});
  return true;
};
RT.prototype.cuantos=function(tipo){ var n=0, p=this.presence; Object.keys(p).forEach(function(k){ (p[k].metas||[]).forEach(function(m){ if(m.tipo===tipo) n++; }); }); return n; };

/* -------- bus: mismo equipo (BroadcastChannel) + internet (Realtime) -------- */
var BUS = { bc:null, rt:null, h:[], last:{} };
function busInit(){
  try{ BUS.bc=new BroadcastChannel('proy-local'); BUS.bc.onmessage=function(e){ busRecv(e.data.event, e.data.env); }; }catch(e){}
}
function busConectar(sala, meta){
  if(BUS.rt){ BUS.rt.cerrado=true; try{ BUS.rt.ws.close(); }catch(e){} clearInterval(BUS.rt.hb); }
  BUS.rt=null; if(!sala) return null;
  BUS.rt=new RT(sala, meta);
  BUS.rt.on('msg',function(d){ busRecv(d.event,d.env); });
  return BUS.rt;
}
function busSend(ev, payload){
  var env={from:CID, seq:++SEQ, p:payload};
  if(BUS.bc) try{ BUS.bc.postMessage({event:ev, env:env}); }catch(e){}
  if(BUS.rt) BUS.rt.send(ev, env);
}
function busOn(cb){ BUS.h.push(cb); }
function busRecv(ev, env){
  if(!env || env.from===CID) return;
  if((BUS.last[env.from]||0) >= env.seq) return; // duplicado (llegó por los dos canales) o viejo
  BUS.last[env.from]=env.seq;
  BUS.h.forEach(function(cb){ try{ cb(ev, env.p, env.from); }catch(e){ console.error(e); } });
}

var BIB=null, BIB_P=null;
function bibliaCargar(){
  if(BIB) return Promise.resolve(BIB);
  if(!BIB_P) BIB_P=fetch('biblia-rv1909.json').then(function(r){ if(!r.ok) throw new Error('No se pudo cargar la Biblia'); return r.json(); }).then(function(d){ BIB=d; return d; }).catch(function(e){ BIB_P=null; throw e; });
  return BIB_P;
}
function buscarLibro(tok){
  tok=tok.replace(/\s+/g,'');
  for(var i=0;i<LIBROS.length;i++){ if(LIBROS[i][1].split(' ').indexOf(tok)>=0) return i; }
  for(var j=0;j<LIBROS.length;j++){ if(norm(LIBROS[j][0]).replace(/\s+/g,'')===tok) return j; }
  if(tok.replace(/^\d/,'').length<2) return -1;
  for(var k=0;k<LIBROS.length;k++){ if(norm(LIBROS[k][0]).replace(/\s+/g,'').indexOf(tok)===0) return k; }
  return -1;
}
function parseRef(q){
  var s=norm(q).replace(/[.]/g,' ').replace(/\s+/g,' ').trim();
  var m=s.match(/^([123])?\s*([a-zñ]+)\s*(\d+)?(?:\s*[:\s,]\s*(\d+)(?:\s*-\s*(\d+))?)?$/);
  if(!m) return null;
  var b=buscarLibro((m[1]||'')+m[2]); if(b<0) return null;
  var c=m[3]?+m[3]:1, v1=m[4]?+m[4]:null, v2=m[5]?+m[5]:null;
  if(BIB){
    if(c<1||c>BIB[b].length) return null;
    var nv=BIB[b][c-1].length;
    if(v1){ if(v1>nv) return null; if(!v2||v2<v1) v2=v1; if(v2>nv) v2=nv; }
  } else if(v1 && (!v2||v2<v1)) v2=v1;
  return {b:b,c:c,v1:v1,v2:v2};
}
function refTxt(r){ return LIBROS[r.b][0]+' '+r.c+(r.v1?':'+r.v1+(r.v2&&r.v2!==r.v1?'-'+r.v2:''):''); }
function partirLargo(t){
  if(t.length<=230) return [t];
  var mid=Math.floor(t.length/2), best=-1, bd=1e9;
  t.replace(/[;:,.!?]\s/g,function(x,i){ var d=Math.abs(i-mid); if(d<bd){ bd=d; best=i+1; } return x; });
  if(best<0){ best=t.lastIndexOf(' ',mid); if(best<0) best=mid; }
  return partirLargo(t.slice(0,best).trim()).concat(partirLargo(t.slice(best).trim()));
}
function slidesBiblia(r, todo){
  var cap=BIB[r.b][r.c-1], a=1, z=cap.length;
  if(!todo && r.v1){ a=r.v1; z=r.v2||r.v1; }
  var out=[];
  for(var v=a; v<=z; v++){
    var partes=partirLargo(cap[v-1]);
    partes.forEach(function(p,i){ out.push({texto:p, etiqueta:'v. '+v+(partes.length>1?' ('+(i+1)+'/'+partes.length+')':''), ref:LIBROS[r.b][0]+' '+r.c+':'+v+' · RV1909', v:v}); });
  }
  return out;
}

/* =====================================================================
   CANTOS · separar letra en diapositivas
   Estrofas separadas por línea en blanco. Etiqueta opcional: [Coro]
   Una línea sola "[Coro]" repite el coro ya escrito.
   ===================================================================== */
function slidesLetra(letra, lineasMax){
  lineasMax=Math.max(1,+lineasMax||4);
  var bloques=String(letra||'').replace(/\r/g,'').split(/\n\s*\n/);
  var mapa={}, out=[], n=0;
  bloques.forEach(function(b){
    var ls=b.split('\n').map(function(l){return l.trim();}).filter(function(l){return l;});
    if(!ls.length) return;
    var etq=null, m=ls[0].match(/^\[(.+)\]$/);
    if(m){ etq=m[1].trim(); ls=ls.slice(1); }
    if(!ls.length){ if(etq && mapa[norm(etq)]) ls=mapa[norm(etq)]; else return; }
    if(!etq){ n++; etq='Estrofa '+n; }
    mapa[norm(etq)]=ls;
    var k=Math.ceil(ls.length/lineasMax), tam=Math.ceil(ls.length/k);
    for(var i=0;i<k;i++){ out.push({texto:ls.slice(i*tam,(i+1)*tam).join('\n'), etiqueta:etq+(k>1?' ('+(i+1)+'/'+k+')':'')}); }
  });
  return out;
}
function slidesTexto(t){
  return String(t||'').replace(/\r/g,'').split(/\n\s*\n/).map(function(b){return b.trim();}).filter(function(b){return b;}).map(function(b,i){ return {texto:b, etiqueta:'Diapositiva '+(i+1)}; });
}

var S = { session:null, user:null, profile:null, sala:null, tema:temaFull(), cultos:[], culto:null, items:[], cantos:[],
          deck:null, liveDeck:null, live:{slide:null,next:null,negro:false,logo:false,oculto:false,msg:'',cuenta:null,pos:null},
          tab:'slides', mob:'culto', bq:'', bref:null, cq:'' };
function req(path, opts, ms){
  ms=ms||12000; opts=opts||{};
  var ctrl=new AbortController(), timer=setTimeout(function(){ ctrl.abort(); },ms);
  opts.signal=ctrl.signal; opts.headers=opts.headers||{};
  opts.headers.apikey=ANON;
  if(S.session&&S.session.access_token) opts.headers.Authorization='Bearer '+S.session.access_token;
  return fetch(URL_BASE+path,opts).then(function(r){ clearTimeout(timer); return r; })
    .catch(function(e){ clearTimeout(timer); throw new Error(e.name==='AbortError'?'Tiempo de espera agotado':'Sin conexión'); });
}
async function asegurarSesion(){
  if(S.session && expirada(S.session) && S.session.refresh_token){ var f=await refrescar(S.session.refresh_token); if(!f){ clearSession(); location.reload(); } }
}
function errTxt(t){ try{ var j=JSON.parse(t); if(j.code==='42P01'||/does not exist|schema cache/.test(j.message||'')) return 'Faltan las tablas de Proyección en Supabase (corre el SQL de instalación).'; return j.message||t; }catch(e){ return t; } }
async function dbGet(tabla,q){ await asegurarSesion(); var r=await req('/rest/v1/'+tabla+(q?'?'+q:''),{headers:{Accept:'application/json'}}); if(!r.ok) throw new Error(errTxt(await r.text())); return r.json(); }
async function dbPost(tabla,body){ await asegurarSesion(); var r=await req('/rest/v1/'+tabla,{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(errTxt(await r.text())); var t=await r.text(); return t?JSON.parse(t):null; }
async function dbPatch(tabla,q,body){ await asegurarSesion(); var r=await req('/rest/v1/'+tabla+'?'+q,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(errTxt(await r.text())); var t=await r.text(); return t?JSON.parse(t):null; }
async function dbDel(tabla,q){ await asegurarSesion(); var r=await req('/rest/v1/'+tabla+'?'+q,{method:'DELETE',headers:{Prefer:'return=minimal'}}); if(!r.ok) throw new Error(errTxt(await r.text())); return true; }
async function dbUpsert(tabla,body,oc){ await asegurarSesion(); var r=await req('/rest/v1/'+tabla+(oc?'?on_conflict='+oc:''),{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=representation'},body:JSON.stringify(body)}); if(!r.ok) throw new Error(errTxt(await r.text())); var t=await r.text(); return t?JSON.parse(t):null; }
function saveSession(s){ try{ localStorage.setItem(STORE,JSON.stringify(s)); }catch(e){} S.session=s; }
function loadSession(){ try{ var s=JSON.parse(localStorage.getItem(STORE)||'null'); return (s&&s.access_token)?s:null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(STORE); }catch(e){} S.session=null; S.user=null; S.profile=null; }
function expirada(s){ return !s||!s.expires_at||(Date.now()/1000)>(s.expires_at-60); }
async function login(email,pass){
  var r=await req('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})},15000);
  var d=await r.json(); if(!r.ok) throw new Error(d.error_description||d.msg||'Correo o contraseña incorrectos');
  d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600); saveSession(d); S.user=d.user; return d;
}
async function refrescar(rt){
  try{
    var r=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})},10000);
    if(!r.ok) return null; var d=await r.json(); if(!d.access_token) return null;
    d.expires_at=Math.floor(Date.now()/1000)+(d.expires_in||3600); saveSession(d); S.user=d.user; return d;
  }catch(e){ return null; }
}

async function cargarCultos(soloLista){
  try{
    S.cultos=await dbGet('proy_cultos','iglesia_id=eq.'+IGLESIA+'&select=*&order=fecha.desc,created_at.desc&limit=40');
    if(soloLista){ if(S.culto && !S.cultos.some(function(c){return c.id===S.culto.id;})){ S.culto=null; S.items=[]; rCulto(); } rTop(); return; }
    var guard=localStorage.getItem('proy_culto'), hoy=hoyISO();
    var c=S.cultos.find(function(x){return x.id===guard;}) || S.cultos.find(function(x){return x.fecha===hoy;});
    if(!c){ var fut=S.cultos.filter(function(x){return x.fecha>=hoy;}); c=fut.length?fut[fut.length-1]:null; }
    if(c) await elegirCulto(c.id,true); else { rTop(); rCulto(); }
  }catch(e){ toast(e.message,'err'); rCulto(); }
}
async function elegirCulto(id,silencio){
  S.culto=S.cultos.find(function(x){return x.id===id;})||null;

/* ---------- decks (conjuntos de diapositivas) ---------- */
var DECKS={};
function deckItem(it){
  var d={key:'it:'+it.id, item:it, tipo:it.tipo, slides:[]};
  if(it.tipo==='canto'){ var c=it.canto; d.titulo=c?c.titulo:(it.titulo||'Canto eliminado'); d.sub=c?(c.autor||''):''; d.slides=c?slidesLetra(c.letra,S.tema.lineas):[]; }
  else if(it.tipo==='biblia'){ d.titulo=it.ref||'Biblia'; d.sub='RV1909'; var r=parseRef(it.ref||''); d.slides=(r&&BIB)?slidesBiblia(r):[]; }
  else { d.titulo=it.titulo||'Texto'; d.sub='Texto'; d.slides=slidesTexto(it.contenido); }
  DECKS[d.key]=d; return d;
}
function deckCanto(c){ var d={key:'ct:'+c.id, canto:c, tipo:'canto', titulo:c.titulo, sub:c.autor||'', slides:slidesLetra(c.letra,S.tema.lineas)}; DECKS[d.key]=d; return d; }
function deckCap(b,c){ var d={key:'bb:'+b+':'+c, tipo:'biblia', titulo:LIBROS[b][0]+' '+c, sub:'RV1909', b:b, c:c, slides:slidesBiblia({b:b,c:c},true)}; DECKS[d.key]=d; return d; }
function deckPorKey(k){
  if(!k) return null;
  if(k.indexOf('it:')===0){ var it=S.items.find(function(x){return 'it:'+x.id===k;}); return it?deckItem(it):null; }
  if(k.indexOf('ct:')===0){ var c=S.cantos.find(function(x){return 'ct:'+x.id===k;}); return c?deckCanto(c):null; }
  if(k.indexOf('bb:')===0 && BIB){ var p=k.split(':'); return deckCap(+p[1],+p[2]); }
  return DECKS[k]||null;
}
function reconstruirDecks(){
  if(S.deck){ var d=deckPorKey(S.deck.key); S.deck=d; }
  var lk=S.liveDeck?S.liveDeck.key:(S.live.pos&&S.live.pos.key);
  if(lk){ var l=deckPorKey(lk); if(l) S.liveDeck=l; }
  rCentro();
}

function teclas(e){
  var t=e.target&&e.target.tagName; if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT') return;
  if(document.querySelector('[id^="m"].fixed')) { if(e.key==='Escape'){ var ms=document.querySelectorAll('.fixed.inset-0.z-\\[70\\]'); if(ms.length) ms[ms.length-1].remove(); } return; }
  var k=e.key;
  if(k==='ArrowRight'||k===' '||k==='PageDown'){ e.preventDefault(); avanzar(1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); avanzar(-1); }
  else if(k==='b'||k==='B'||k==='.') capa('negro');
  else if(k==='l'||k==='L') capa('logo');
  else if(k==='h'||k==='H') capa('oculto');
  else if(k==='Escape') capa('limpiar');
}
window.addEventListener('resize',debounce(function(){ if($('miniStage')) renderStage($('miniStage'),S.live,S.tema); },150));

function modalTema(){
  var t=temaFull(S.tema), tmp=JSON.parse(JSON.stringify(t));
  var sw=Object.keys(PRESETS).map(function(k){ return '<button type="button" data-f="'+k+'" class="tF h-12 rounded-xl border-2 '+(t.fondo===k?'border-white':'border-transparent')+'" style="background:'+PRESETS[k]+'" title="'+k+'"></button>'; }).join('')+
    '<label class="tF h-12 rounded-xl border-2 '+(t.fondo==='color'?'border-white':'border-slate-700')+' flex items-center justify-center cursor-pointer relative" data-f="color" style="background:'+t.fondoColor+'"><i data-lucide="pipette" class="w-4 h-4"></i><input type="color" id="tFC" value="'+t.fondoColor+'" class="absolute inset-0 opacity-0 cursor-pointer"></label>';
  modal('mTema','Tema visual',

     '<div><div class="text-sm font-semibold mb-2">Fondo</div><div class="grid grid-cols-7 gap-2">'+sw+'</div></div>'+
     '<div><div class="text-sm font-semibold mb-2">Imagen de fondo <span class="font-normal text-slate-500">(opcional)</span></div>'+
      '<div class="flex gap-2"><input id="tFI" value="'+esc(t.fondoImg)+'" placeholder="Pega un enlace o sube una imagen" class="'+INP+' !py-2 text-sm"><label class="'+BTN+' !px-3 bg-slate-800 hover:bg-slate-700 cursor-pointer shrink-0"><i data-lucide="upload" class="w-4 h-4"></i><input type="file" accept="image/*" id="tFU" class="hidden"></label></div>'+
      '<label class="flex items-center gap-3 mt-2 text-sm text-slate-300">Oscurecer <input type="range" id="tOs" min="0" max="85" value="'+t.oscurecer+'" class="flex-1"></label></div>'+
     '<div class="grid grid-cols-2 gap-3"><div><div class="text-sm font-semibold mb-2">Letra</div><select id="tFu" class="'+INP+' !py-2 text-sm"><option value="sans">Moderna</option><option value="serif">Clásica</option><option value="cond">Condensada</option></select></div>'+
      '<div><div class="text-sm font-semibold mb-2">Color de letra</div><input type="color" id="tCo" value="'+t.color+'" class="w-full h-10 rounded-xl bg-slate-950 border border-slate-700"></div></div>'+
     '<label class="block text-sm"><span class="font-semibold">Tamaño máximo</span><input type="range" id="tTa" min="4" max="14" step="0.5" value="'+t.tam+'" class="w-full"></label>'+
     '<div class="grid grid-cols-2 gap-3"><label class="block text-sm"><span class="font-semibold">Líneas por diapositiva</span><select id="tLi" class="'+INP+' !py-2 text-sm mt-1">'+[2,3,4,5,6,8].map(function(n){return '<option'+(n===t.lineas?' selected':'')+'>'+n+'</option>';}).join('')+'</select></label>'+
      '<label class="block text-sm"><span class="font-semibold">Alineación</span><select id="tAl" class="'+INP+' !py-2 text-sm mt-1"><option value="center">Centro</option><option value="left">Izquierda</option></select></label></div>'+
     '<div class="flex gap-4 text-sm"><label class="flex items-center gap-2"><input type="checkbox" id="tMa"'+(t.mayus?' checked':'')+' class="w-4 h-4 accent-indigo-500">MAYÚSCULAS</label><label class="flex items-center gap-2"><input type="checkbox" id="tSo"'+(t.sombra?' checked':'')+' class="w-4 h-4 accent-indigo-500">Sombra</label></div>'+
     '<div><div class="text-sm font-semibold mb-2">Logo <span class="font-normal text-slate-500">(botón Logo)</span></div>'+
      '<div class="flex gap-2"><input id="tLg" value="'+esc(t.logoImg)+'" placeholder="Enlace de imagen (PNG)" class="'+INP+' !py-2 text-sm"><label class="'+BTN+' !px-3 bg-slate-800 hover:bg-slate-700 cursor-pointer shrink-0"><i data-lucide="upload" class="w-4 h-4"></i><input type="file" accept="image/*" id="tLU" class="hidden"></label></div>'+
      '<input id="tLT" value="'+esc(t.logoTexto)+'" placeholder="Texto si no hay imagen" class="'+INP+' !py-2 text-sm mt-2"></div>'+
     '<div class="flex gap-2 pt-1"><button type="button" onclick="cerrarModal(\'mTema\')" class="'+BTN+' flex-1 bg-slate-800 hover:bg-slate-700">Cancelar</button><button type="button" id="tOk" class="'+BTN+' flex-1 bg-indigo-600 hover:bg-indigo-500">Guardar y aplicar</button></div>'+
    '</div>','sm:max-w-xl');
  $('tFu').value=t.fuente; $('tAl').value=t.alinear;
  var demo={slide:{texto:'Cuán grande es Él\nCuán grande es Él',etiqueta:'Coro'}};
  function leer(){
    tmp.fondoImg=$('tFI').value.trim(); tmp.oscurecer=+$('tOs').value; tmp.fuente=$('tFu').value; tmp.color=$('tCo').value;
    tmp.tam=+$('tTa').value; tmp.lineas=+$('tLi').value; tmp.alinear=$('tAl').value; tmp.mayus=$('tMa').checked; tmp.sombra=$('tSo').checked;
    tmp.logoImg=$('tLg').value.trim(); tmp.logoTexto=$('tLT').value; tmp.fondoColor=$('tFC').value;
    renderStage($('tPrev'),demo,tmp);
  }
  document.querySelectorAll('#mTema .tF').forEach(function(x){ x.addEventListener('click',function(){ tmp.fondo=x.getAttribute('data-f'); document.querySelectorAll('#mTema .tF').forEach(function(y){ y.classList.toggle('border-white',y===x); y.classList.toggle('border-transparent',y!==x&&y.tagName==='BUTTON'); }); leer(); }); });
  $('tFC').addEventListener('input',function(){ tmp.fondo='color'; this.parentNode.style.background=this.value; leer(); });
  ['tFI','tOs','tFu','tCo','tTa','tLi','tAl','tMa','tSo','tLg','tLT'].forEach(function(id){ $(id).addEventListener('input',leer); $(id).addEventListener('change',leer); });
  $('tFU').onchange=function(){ subirImagen(this.files[0],'fondo').then(function(u){ if(u){ $('tFI').value=u; leer(); } }); };
  $('tLU').onchange=function(){ subirImagen(this.files[0],'logo').then(function(u){ if(u){ $('tLg').value=u; leer(); } }); };

    leer();

      var cambioLineas=tmp.lineas!==S.tema.lineas;
      S.tema=temaFull(tmp); cerrarModal('mTema'); emitir(); busSend('tema',{t:S.tema});
      if(cambioLineas) reconstruirDecks();
      toast('Tema aplicado');
    }catch(e){ toast(e.message,'err'); }
  };
  setTimeout(leer,30);
}
function comprimir(file,max,tipo){
  return new Promise(function(ok,ko){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?ok(b):ko(new Error('No se pudo procesar la imagen')); },tipo,0.85);
    };
    img.onerror=function(){ ko(new Error('Imagen no válida')); };
    img.src=url;
  });
}
async function subirImagen(file,clase){
  if(!file) return null;
  try{
    toast('Subiendo imagen…');
    var png=clase==='logo'&&/png|svg|webp/.test(file.type);
    var blob=await comprimir(file,clase==='logo'?1000:1920,png?'image/png':'image/jpeg');
    var path=IGLESIA+'/'+clase+'-'+Date.now()+(png?'.png':'.jpg');
    await asegurarSesion();
    var r=await req('/storage/v1/object/proy-medios/'+path,{method:'POST',headers:{'Content-Type':png?'image/png':'image/jpeg','x-upsert':'true'},body:blob},60000);
    if(!r.ok) throw new Error(errTxt(await r.text()));
    toast('Imagen lista');
    return URL_BASE+'/storage/v1/object/public/proy-medios/'+path;
  }catch(e){ toast(e.message,'err'); return null; }
}

async function arrancar(){
  var h=hashParams();
  if(h.vista==='pantalla') return vistaPantalla(h.p);
  if(h.vista==='escenario') return vistaEscenario(h.p);
  await Promise.all([
    loadScript('https://cdn.tailwindcss.com'),
    loadScript('https://unpkg.com/lucide@latest/dist/umd/lucide.min.js').catch(function(){})
  ]).catch(function(){});
  var s=loadSession();
  if(!s) return vistaLogin();
  S.session=s; S.user=s.user;
  if(expirada(s)){ var f=await refrescar(s.refresh_token); if(!f){ clearSession(); return vistaLogin(); } }
  iniciarControl();
}
